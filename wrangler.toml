# Cloudflare Worker config for NewportHub.
# `astro build` reads this file and writes the deployable config to dist/server/wrangler.json.
name = "newporthub"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
main = "@astrojs/cloudflare/entrypoints/server"

# Workers Custom Domain: `wrangler deploy` creates the DNS record and certificate for this
# hostname in the newporthub.com zone. Do not add A/CNAME records for it by hand.
routes = [{ pattern = "newporthub.com", custom_domain = true }]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "newporthub"
database_id = "b315a85f-9541-4051-be32-0cb868daa7af"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "newporthub-media"

# Live price ids for the NewportHub Stripe account (acct_1UVVEACQlLtUg0Tw).
# Plus $15/month, Plus $149/year, Featured $39/month, Featured $350/year.
# Plain text Worker vars. A deploy publishes them. .dev.vars overrides them locally
# (use test-mode price ids there, or leave them empty to hide that option).
[vars]
STRIPE_PRICE_PLUS_MONTHLY = "price_1UVVNNCQlLtUg0TwaKOCHQEn"
STRIPE_PRICE_PLUS_YEARLY = "price_1UVVNPCQlLtUg0TwFckRXTmm"
STRIPE_PRICE_FEATURED_MONTHLY = "price_1UVVNRCQlLtUg0TwSJOHSmY4"
STRIPE_PRICE_FEATURED_YEARLY = "price_1UVVNTCQlLtUg0TwAjtTPv9K"
