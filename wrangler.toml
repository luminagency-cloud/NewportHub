# Cloudflare Worker config for NewportHub.
# `astro build` reads this file and writes the deployable config to dist/server/wrangler.json.
name = "newporthub"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
main = "@astrojs/cloudflare/entrypoints/server"

# Workers Custom Domain: `wrangler deploy` creates the DNS record and certificate for this
# hostname in the newporthub.com zone. Do not add A/CNAME records for it by hand.
routes = [{ pattern = "newporthub.com", custom_domain = true }]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "newporthub"
database_id = "b315a85f-9541-4051-be32-0cb868daa7af"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "newporthub-media"
